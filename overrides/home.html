{% extends "main.html" %}

{% block content %}

  <!-- Sakura Robotics Lab · 首页 Hero（左文案 + 右吉祥物，克制品牌视觉） -->
  <section class="rt-hero" aria-label="站点介绍">
    <div class="rt-hero__text">
      <p class="rt-hero__eyebrow">SAKURA ROBOTICS LAB · 樱雷机器人研习社</p>
      <h1 class="rt-hero__title" style="margin-bottom:0.2rem">Robotics Tutorial</h1>
      <p class="rt-hero__title-sub">机器人系统化学习教程</p>
      <p class="rt-hero__subtitle">从数学基础、C++ 和 ROS 2，到 SLAM、运动控制与具身智能。</p>
      <p class="rt-hero__desc">
        面向机器人开发者的系统化知识库，覆盖理论、工程、源码、API 与完整项目实践。
        由吉祥物「小樱丸」陪读，从零基础筑基一路修习至前沿。
      </p>
      <div class="rt-hero__actions">
        <a href="{{ '00_项目导航/从零开始学习路线总图/' | url }}" class="md-button md-button--primary">开始学习</a>
        <a href="{{ '00_项目导航/从零开始学习路线总图/' | url }}" class="md-button">查看学习路线</a>
        <a href="https://github.com/MUHAN11-c/ros2_robot" class="md-button">GitHub</a>
      </div>
    </div>
    <div class="rt-hero__mascot">
      <img src="{{ 'assets/images/mascot.svg' | url }}" alt="樱雷工程狐·小樱丸" width="260" height="260">
    </div>
  </section>

  {{ super() }}

{% endblock %}
