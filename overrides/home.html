{% extends "main.html" %}

{% block content %}

  <!-- Sakura Robotics Lab · 首页 Hero（左文案 + 右吉祥物，克制品牌视觉） -->
  <section class="rt-hero" aria-label="站点介绍">
    <div class="rt-hero__text">
      <p class="rt-hero__eyebrow">SAKURA ROBOTICS LAB · 樱雷机器人研习社</p>
      <h1 class="rt-hero__title" style="margin-bottom:0.2rem">Robotics Tutorial</h1>
      <p class="rt-hero__title-sub">机器人系统化学习教程</p>
      <p class="rt-hero__subtitle">从数学基础、C++ 和 ROS 2，到 SLAM、运动控制与具身智能。</p>
      <p class="rt-hero__desc">
        面向机器人开发者的系统化知识库，覆盖理论、工程、源码、API 与完整项目实践。
        由吉祥物「紫樱」陪读，从零基础筑基一路修习至前沿。
      </p>
      <div class="rt-hero__actions">
        <a href="{{ '00_项目导航/从零开始学习路线总图/' | url }}" class="md-button md-button--primary">开始学习</a>
        <a href="{{ '00_项目导航/从零开始学习路线总图/' | url }}" class="md-button">查看学习路线</a>
        <a href="https://github.com/MUHAN11-c/ros2_robot" class="md-button">GitHub</a>
      </div>
      <div class="rt-hero__tags" aria-label="技术栈标签">
        <span class="rt-hero__tag">ROS 2</span>
        <span class="rt-hero__tag">C++</span>
        <span class="rt-hero__tag">Python</span>
        <span class="rt-hero__tag">SLAM</span>
        <span class="rt-hero__tag">运动控制</span>
        <span class="rt-hero__tag">具身智能</span>
      </div>
    </div>
    <div class="rt-hero__mascot">
      <div class="rt-hero__stage">
        <span class="rt-hero__glow" aria-hidden="true"></span>
        <span class="rt-hero__orbit rt-hero__orbit--1" aria-hidden="true"></span>
        <span class="rt-hero__orbit rt-hero__orbit--2" aria-hidden="true"></span>
        <span class="rt-hero__orbit-node rt-hero__orbit-node--a" aria-hidden="true"></span>
        <span class="rt-hero__orbit-node rt-hero__orbit-node--b" aria-hidden="true"></span>
        <img src="{{ 'assets/images/mascot.svg' | url }}" alt="紫樱 · 机器人研究员吉祥物" width="260" height="260">
      </div>
    </div>
  </section>

  {{ super() }}

{% endblock %}
