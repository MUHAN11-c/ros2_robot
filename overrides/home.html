{% extends "main.html" %}

{% block content %}

  <!-- SakuraBot Lab · 樱机实验室 · 首页 Hero（Linear 式光晕 + 大幅插画锚点） -->
  <section class="rt-hero" aria-label="站点介绍">
    <div class="rt-hero__glow rt-hero__glow--violet" aria-hidden="true"></div>
    <div class="rt-hero__glow rt-hero__glow--pink" aria-hidden="true"></div>
    <div class="rt-hero__text">
      <p class="rt-hero__eyebrow">SAKURABOT LAB · 樱机实验室</p>
      <h1 class="rt-hero__title">机器人系统化学习教程</h1>
      <p class="rt-hero__subtitle">
        从数学基础、C++ 和 ROS 2，到 SLAM、运动控制与具身智能。<br>
        470+ 页系统教程 · 11 个可视化实验 · 紫樱全程陪读。
      </p>
      <div class="rt-hero__actions">
        <a href="{{ '00_项目导航/从零开始学习路线总图/' | url }}" class="md-button md-button--primary">开始学习</a>
        <a href="{{ '08_可视化实验室/' | url }}" class="md-button">可视化实验室</a>
        <a href="https://github.com/MUHAN11-c/ros2_robot" class="md-button">GitHub</a>
      </div>
      <div class="rt-hero__tags" aria-label="技术栈标签">
        <span class="rt-hero__tag">ROS 2</span>
        <span class="rt-hero__tag">C++</span>
        <span class="rt-hero__tag">Python</span>
        <span class="rt-hero__tag">SLAM</span>
        <span class="rt-hero__tag">运动控制</span>
        <span class="rt-hero__tag">具身智能</span>
      </div>
    </div>
    <div class="rt-hero__figure">
      <img class="rt-hero__mascot-img" src="{{ 'assets/mascots/sakura-02.webp' | url }}"
           alt="紫樱 · 樱机实验室看板娘" width="400" height="500">
      <span class="rt-hero__petal" style="--i:0" aria-hidden="true"></span>
      <span class="rt-hero__petal" style="--i:1" aria-hidden="true"></span>
      <span class="rt-hero__petal" style="--i:2" aria-hidden="true"></span>
      <span class="rt-hero__petal" style="--i:3" aria-hidden="true"></span>
    </div>
  </section>

  {{ super() }}

{% endblock %}
