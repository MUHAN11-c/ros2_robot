site_name: Robotics Tutorial
site_description: 樱雷机器人研习社 · 面向机器人开发者的系统化知识库——从数学基础、C++ 和 ROS 2，到 SLAM、运动控制与具身智能。
site_author: Pengfei Guo
site_url: https://muhuan11-c.github.io/ros2_robot/

repo_name: MUHAN11-c/ros2_robot
repo_url: https://github.com/MUHAN11-c/ros2_robot
edit_uri: edit/main/
docs_dir: .generated/docs
site_dir: site

# 404 页由 sync_docs.py 生成，不进入导航
not_in_nav: 404.md

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  features:
    - navigation.sections
    - navigation.prune
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.select
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: underscore
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/tokens.css
  - stylesheets/base.css
  - stylesheets/layout.css
  - stylesheets/navigation.css
  - stylesheets/content.css
  - stylesheets/code.css
  - stylesheets/components.css
  - stylesheets/responsive.css
  - stylesheets/mascot-assistant.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/app.js
  - javascripts/mascot.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  copyright: Sakura Robotics Lab · 樱雷机器人研习社
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MUHAN11-c/ros2_robot
