site_name: 樱机实验室 SakuraBot Lab
site_description: 樱机实验室 SakuraBot Lab · 面向机器人开发者的系统化知识库——从数学基础、C++ 和 ROS 2，到 SLAM、运动控制与具身智能。
site_author: Pengfei Guo
site_url: https://muhuan11-c.github.io/ros2_robot/

# 不配置 repo_url：Material 9.7 的 repo 徽章会 fetch api.github.com 拉取
# star/版本，匿名限流(403)时 bundle 抛未捕获异常；「编辑此页」按钮由
# scripts/edit_source_hook.py 直接设置 page.edit_url 提供，不依赖 repo_url。
# 若恢复 GitHub Pages 托管并需要页头仓库入口，再加回时需评估限流容错。
docs_dir: .generated/docs
site_dir: site

# 404 页由 sync_docs.py 生成，不进入导航
not_in_nav: 404.md

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/mascots/avatar-128.webp
  favicon: assets/mascots/favicon.png
  features:
    # 不开 navigation.tabs / navigation.sections：
    # - tabs 的 lifted 侧栏在窄屏抽屉里会与顶级列表、页内目录互相叠层盖住章节，
    #   回归无 tabs 的经典折叠侧栏（当前模块展开、其余折叠）在桌面/窄屏都稳定；
    # - sections 会把当前模块全部分组平铺（一栏 100+ 条），同样不用
    - navigation.prune
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.select
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

hooks:
  - scripts/override_404_hook.py
  - scripts/edit_source_hook.py

plugins:
  - search:
      lang:
        - zh
        - en
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # 侧栏/目录只到 H2：章节里 4.1/5.3 这类 H3 小节太多，全量渲染会把目录糊满
      toc_depth: 2
      # 默认 slugify 会丢弃中文字符，导致中文标题锚点全部失效；
      # slugify_unicode 保留 Unicode，锚点与标题文本一致且稳定
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: underscore
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/tokens.css
  - stylesheets/base.css
  - stylesheets/layout.css
  - stylesheets/navigation.css
  - stylesheets/content.css
  - stylesheets/code.css
  - stylesheets/components.css
  - stylesheets/responsive.css
  - stylesheets/mascot-assistant.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/app.js
  - javascripts/mascot.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  copyright: SakuraBot Lab · 樱机实验室
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MUHAN11-c/ros2_robot
