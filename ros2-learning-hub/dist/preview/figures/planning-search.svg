<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">比较搜索时，先对齐同一个问题</title><desc id="desc">网格、障碍、起终点和示意路径，以及Dijkstra和A星的优先级。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#769481"/></marker></defs><rect width="900" height="470" fill="#fbfdf9"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="42" font-size="23" fill="#294b32" font-weight="650">障碍图、代价函数和启发式</text><rect x="45" y="95" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="90" y="95" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="135" y="95" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="180" y="95" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="225" y="95" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="270" y="95" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="315" y="95" width="43" height="43" rx="2" fill="#78927b"/><rect x="360" y="95" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="405" y="95" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="450" y="95" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="45" y="140" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="90" y="140" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="135" y="140" width="43" height="43" rx="2" fill="#78927b"/><rect x="180" y="140" width="43" height="43" rx="2" fill="#78927b"/><rect x="225" y="140" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="270" y="140" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="315" y="140" width="43" height="43" rx="2" fill="#78927b"/><rect x="360" y="140" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="405" y="140" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="450" y="140" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="45" y="185" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="90" y="185" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="135" y="185" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="180" y="185" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="225" y="185" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="270" y="185" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="315" y="185" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="360" y="185" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="405" y="185" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="450" y="185" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="45" y="230" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="90" y="230" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="135" y="230" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="180" y="230" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="225" y="230" width="43" height="43" rx="2" fill="#78927b"/><rect x="270" y="230" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="315" y="230" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="360" y="230" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="405" y="230" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="450" y="230" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="45" y="275" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="90" y="275" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="135" y="275" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="180" y="275" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="225" y="275" width="43" height="43" rx="2" fill="#78927b"/><rect x="270" y="275" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="315" y="275" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="360" y="275" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="405" y="275" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="450" y="275" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="45" y="320" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="90" y="320" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="135" y="320" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="180" y="320" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="225" y="320" width="43" height="43" rx="2" fill="#78927b"/><rect x="270" y="320" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="315" y="320" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="360" y="320" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="405" y="320" width="43" height="43" rx="2" fill="#edf3e8"/><rect x="450" y="320" width="43" height="43" rx="2" fill="#edf3e8"/><polyline points="67,342 112,342 112,297 157,297 157,252 202,252 202,207 247,207 292,207 337,207 382,207 427,207 427,162 472,162 472,117" fill="none" stroke="#c18143" stroke-width="5" stroke-linejoin="round"/><line x1="67" y1="342" x2="472" y2="117" stroke="#87a87d" stroke-width="2" stroke-dasharray="6 5"/><text x="58" y="349" font-size="18" fill="#294b32" font-weight="700">S</text><text x="463" y="124" font-size="18" fill="#294b32" font-weight="700">G</text><text x="535" y="120" font-size="15" fill="#526c5a" font-weight="400">Dijkstra：优先累计代价 g</text><text x="535" y="166" font-size="15" fill="#526c5a" font-weight="400">A*：优先 f = g + h</text><text x="535" y="212" font-size="15" fill="#526c5a" font-weight="400">h 是估计，不是额外实测成本</text><text x="535" y="258" font-size="15" fill="#526c5a" font-weight="400">邻接方式、分辨率、代价需对齐</text><text x="535" y="304" font-size="15" fill="#526c5a" font-weight="400">未知区域和障碍膨胀改变问题</text><text x="45" y="425" font-size="14" fill="#526c5a" font-weight="400">网格路径仅作示意；搜索最优性和机器人可执行性是两个层次。</text></g></svg>
