<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Gazebo 红板的真实相机帧与红通道边缘</title><desc id="desc">同一采集时戳的96乘64像素红板图像和黑底白边Canny结果。两个结果并排，可看清红板的竖边。</desc><rect width="900" height="440" fill="#fbfdf9"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="38" y="50" font-size="25" fill="#294b32" font-weight="650">Gazebo 红板的真实相机帧与红通道边缘</text><text x="38" y="93" font-size="19" fill="#345b3b" font-weight="600">原始 RGB · 96 × 64 px</text><text x="462" y="93" font-size="19" fill="#345b3b" font-weight="600">红通道 Canny · mono8</text><image x="38" y="112" width="390" height="260" style="image-rendering:pixelated" href="data:image/png;base64,"/><image x="462" y="112" width="390" height="260" style="image-rendering:pixelated" href="data:image/png;base64,"/><text x="38" y="410" font-size="16" fill="#526c5a" font-weight="400">采样时戳 0.700 s · camera_optical_frame</text><text x="462" y="410" font-size="16" fill="#526c5a" font-weight="400">红通道 128 像素 · 同阈值灰度 0</text></g></svg>
