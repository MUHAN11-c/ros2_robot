<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">用预测和测量修正状态</title><desc id="desc">运动预测、创新、测量校正和协方差递推的闭环。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#769481"/></marker></defs><rect width="900" height="470" fill="#fbfdf9"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="42" font-size="23" fill="#294b32" font-weight="650">状态和不确定性一起递推</text><rect x="40" y="102" width="235" height="78" rx="8" fill="#edf5ed" stroke="#c8dbc8"/><text x="56" y="131" font-size="17" fill="#345b3b" font-weight="600">预测</text><text x="56" y="155" font-size="12" fill="#526c5a" font-weight="400">状态 x⁻，协方差 P⁻</text><rect x="335" y="102" width="235" height="78" rx="8" fill="#edf5ed" stroke="#c8dbc8"/><text x="351" y="131" font-size="17" fill="#345b3b" font-weight="600">创新与一致性</text><text x="351" y="155" font-size="12" fill="#526c5a" font-weight="400">r = z − h(x⁻)</text><rect x="630" y="102" width="230" height="78" rx="8" fill="#edf5ed" stroke="#c8dbc8"/><text x="646" y="131" font-size="17" fill="#345b3b" font-weight="600">校正</text><text x="646" y="155" font-size="12" fill="#526c5a" font-weight="400">状态 x⁺，协方差 P⁺</text><line x1="275" y1="140" x2="335" y2="140" stroke="#769481" stroke-width="2" marker-end="url(#arrow)"/><line x1="570" y1="140" x2="630" y2="140" stroke="#769481" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="264" width="235" height="75" rx="8" fill="#edf5ed" stroke="#c8dbc8"/><text x="56" y="293" font-size="17" fill="#345b3b" font-weight="600">运动与过程噪声</text><text x="56" y="317" font-size="12" fill="#526c5a" font-weight="400">模型、控制输入、Q</text><rect x="335" y="264" width="235" height="75" rx="8" fill="#edf5ed" stroke="#c8dbc8"/><text x="351" y="293" font-size="17" fill="#345b3b" font-weight="600">测量与噪声</text><text x="351" y="317" font-size="12" fill="#526c5a" font-weight="400">传感器观测 z、R</text><rect x="630" y="264" width="230" height="75" rx="8" fill="#edf5ed" stroke="#c8dbc8"/><text x="646" y="293" font-size="17" fill="#345b3b" font-weight="600">下一轮</text><text x="646" y="317" font-size="12" fill="#526c5a" font-weight="400">保存时间与坐标合同</text><line x1="155" y1="264" x2="155" y2="180" stroke="#769481" stroke-width="2" marker-end="url(#arrow)"/><line x1="450" y1="264" x2="450" y2="180" stroke="#769481" stroke-width="2" marker-end="url(#arrow)"/><line x1="745" y1="180" x2="745" y2="264" stroke="#769481" stroke-width="2" marker-end="url(#arrow)"/><path d="M745 339V384H155V180" fill="none" stroke="#769481" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="433" font-size="14" fill="#526c5a" font-weight="400">图示为滤波估计流程；线性、高斯、独立性与可观性条件须按正文核对。</text></g></svg>
