<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">预测多步，执行一步，重新观测</title><desc id="desc">模型预测控制的预测时域与滚动执行顺序。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#769481"/></marker></defs><rect width="900" height="470" fill="#fbfdf9"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="42" font-size="23" fill="#294b32" font-weight="650">模型预测与滚动执行</text><line x1="65" y1="335" x2="520" y2="335" stroke="#769481" stroke-width="2" marker-end="url(#arrow)"/><line x1="65" y1="335" x2="65" y2="85" stroke="#769481" stroke-width="2" marker-end="url(#arrow)"/><polyline points="65,112 120,165 175,209 230,244 285,273 340,294 395,309 450,319 505,325" fill="none" stroke="#5b8d62" stroke-width="3" stroke-dasharray="7 5"/><circle cx="65" cy="112" r="7" fill="#b98048"/><text x="33" y="80" font-size="16" fill="#526c5a" font-weight="400">状态</text><text x="453" y="363" font-size="16" fill="#526c5a" font-weight="400">预测步 k</text><text x="62" y="357" font-size="11" fill="#526c5a" font-weight="400">0</text><text x="117" y="357" font-size="11" fill="#526c5a" font-weight="400">1</text><text x="172" y="357" font-size="11" fill="#526c5a" font-weight="400">2</text><text x="227" y="357" font-size="11" fill="#526c5a" font-weight="400">3</text><text x="282" y="357" font-size="11" fill="#526c5a" font-weight="400">4</text><text x="337" y="357" font-size="11" fill="#526c5a" font-weight="400">5</text><text x="392" y="357" font-size="11" fill="#526c5a" font-weight="400">6</text><text x="447" y="357" font-size="11" fill="#526c5a" font-weight="400">7</text><text x="502" y="357" font-size="11" fill="#526c5a" font-weight="400">8</text><rect x="565" y="93" width="295" height="74" rx="8" fill="#edf5ed" stroke="#c8dbc8"/><text x="581" y="122" font-size="17" fill="#345b3b" font-weight="600">优化一个预测时域</text><text x="581" y="146" font-size="12" fill="#526c5a" font-weight="400">模型、代价、约束、当前状态</text><rect x="565" y="210" width="295" height="74" rx="8" fill="#edf5ed" stroke="#c8dbc8"/><text x="581" y="239" font-size="17" fill="#345b3b" font-weight="600">只执行第一个控制量</text><text x="581" y="263" font-size="12" fill="#526c5a" font-weight="400">控制周期 Δt，单位 s</text><rect x="565" y="327" width="295" height="74" rx="8" fill="#edf5ed" stroke="#c8dbc8"/><text x="581" y="356" font-size="17" fill="#345b3b" font-weight="600">获得新测量，再优化</text><text x="581" y="380" font-size="12" fill="#526c5a" font-weight="400">可行性、求解耗时和降级策略</text><line x1="712" y1="167" x2="712" y2="210" stroke="#769481" stroke-width="2" marker-end="url(#arrow)"/><line x1="712" y1="284" x2="712" y2="327" stroke="#769481" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="429" font-size="14" fill="#526c5a" font-weight="400">轨迹为教学示意；滚动优化不自动构成稳定性或硬实时保证。</text></g></svg>
