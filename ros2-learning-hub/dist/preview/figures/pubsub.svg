<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="pubsub-title pubsub-desc" xml:lang="zh-CN">
  <title id="pubsub-title">发布订阅：一个契约，多个消费者</title>
  <desc id="pubsub-desc">发布者把消息交给匹配的订阅端。虚线区域表示逻辑话题的名称、类型和 QoS 契约，不是中央服务器。订阅端接收数据后，由各自执行器调度回调。</desc>
  <defs>
    <marker id="pubsub-arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#257457" />
    </marker>
    <marker id="pubsub-arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#bf722d" />
    </marker>
  </defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;} </style>
  <rect x="0.75" y="0.75" width="878.5" height="458.5" rx="18" fill="#fbfcfa" stroke="#d8e3da" stroke-width="1.4" />
  <rect x="28" y="25" width="5" height="28" rx="2" fill="#257457" stroke="#257457" stroke-width="1.4" />
  <text x="46" y="45" font-size="24" fill="#20382c" font-weight="700" text-anchor="start">发布订阅：一个契约，多个消费者</text>
  <text x="46" y="69" font-size="16" fill="#5e7166" font-weight="400" text-anchor="start">箭头表示逻辑数据关系，不指定 DDS 的实际传输拓扑。</text>
  <rect x="42" y="159" width="190" height="132" rx="12" fill="white" stroke="#d8e3da" stroke-width="1.4" />
  <text x="137" y="193" font-size="21" fill="#20382c" font-weight="700" text-anchor="middle">发布者节点</text>
  <text x="137" y="224" font-size="17" fill="#257457" font-weight="600" text-anchor="middle">publish(msg)</text>
  <text x="137" y="258" font-size="17" fill="#5e7166" font-weight="400" text-anchor="middle">产生观测数据</text>
  <rect x="266" y="151" width="264" height="132" rx="12" fill="#f8faf7" stroke="#d8e3da" stroke-width="1.4" stroke-dasharray="6 5" />
  <text x="398" y="132" font-size="19" fill="#257457" font-weight="700" text-anchor="middle">逻辑话题 /scan</text>
  <text x="398" y="184" font-size="18" fill="#20382c" font-weight="600" text-anchor="middle">类型：LaserScan</text>
  <text x="398" y="246" font-size="17" fill="#20382c" font-weight="500" text-anchor="middle">名称 · 类型 · QoS</text>
  <text x="398" y="272" font-size="15" fill="#5e7166" font-weight="400" text-anchor="middle">接口契约，不是服务器</text>
  <path d="M 232 218 H 560 V 157 H 594" fill="none" stroke="#257457" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pubsub-arrow-green)" />
  <path d="M 560 218 V 306 H 594" fill="none" stroke="#257457" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pubsub-arrow-green)" />
  <circle cx="560" cy="218" r="4" fill="#257457" />
  <rect x="594" y="102" width="244" height="111" rx="12" fill="white" stroke="#d8e3da" stroke-width="1.4" />
  <text x="616" y="131" font-size="19" fill="#20382c" font-weight="700" text-anchor="start">订阅者 A · 算法</text>
  <text x="616" y="158" font-size="16" fill="#5e7166" font-weight="400" text-anchor="start">提取环境特征</text>
  <rect x="607" y="172" width="218" height="30" rx="7" fill="#edf5ef" stroke="#edf5ef" stroke-width="1.4" />
  <text x="716" y="193" font-size="16" fill="#257457" font-weight="600" text-anchor="middle">Executor 调度回调</text>
  <rect x="594" y="251" width="244" height="111" rx="12" fill="white" stroke="#d8e3da" stroke-width="1.4" />
  <text x="616" y="280" font-size="19" fill="#20382c" font-weight="700" text-anchor="start">订阅者 B · 记录器</text>
  <text x="616" y="307" font-size="16" fill="#5e7166" font-weight="400" text-anchor="start">保存原始消息</text>
  <rect x="607" y="321" width="218" height="30" rx="7" fill="#edf5ef" stroke="#edf5ef" stroke-width="1.4" />
  <text x="716" y="342" font-size="16" fill="#257457" font-weight="600" text-anchor="middle">Executor 调度回调</text>
  <rect x="42" y="326" width="488" height="82" rx="12" fill="#edf5ef" stroke="#edf5ef" stroke-width="1.4" />
  <text x="62" y="355" font-size="18" fill="#257457" font-weight="700" text-anchor="start">端点匹配后，才可能交付数据</text>
  <text x="62" y="381" font-size="16" fill="#5e7166" font-weight="400" text-anchor="start">
    <tspan x="62" dy="0">每个订阅端独立匹配；收到数据 ≠ 已运行回调。</tspan>
  </text>
  <text x="594" y="398" font-size="15" fill="#5e7166" font-weight="400" text-anchor="start">多个消费者可独立加入或退出。</text>
  <text x="42" y="438" font-size="16" fill="#5e7166" font-weight="400" text-anchor="start">QoS 是两端的请求与提供关系；话题不会替应用确认“处理成功”。</text>
</svg>
