<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">同一个点，两种坐标表达</title><desc id="desc">车体B与旋转90度的传感器L坐标系，以及点坐标的旋转平移数值案例。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#769481"/></marker></defs><rect width="900" height="470" fill="#fbfdf9"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="42" font-size="23" fill="#294b32" font-weight="650">先转换分量，再改变原点</text><line x1="125" y1="340" x2="490" y2="340" stroke="#769481" stroke-width="2" marker-end="url(#arrow)"/><line x1="125" y1="340" x2="125" y2="65" stroke="#769481" stroke-width="2" marker-end="url(#arrow)"/><line x1="285" y1="260" x2="285" y2="65" stroke="#b67a4b" stroke-width="2" marker-end="url(#arrow)"/><line x1="285" y1="260" x2="140" y2="260" stroke="#b67a4b" stroke-width="2" marker-end="url(#arrow)"/><line x1="285" y1="100" x2="285" y2="340" stroke="#a8bca3" stroke-width="1" stroke-dasharray="5 5"/><line x1="285" y1="100" x2="125" y2="100" stroke="#a8bca3" stroke-width="1" stroke-dasharray="5 5"/><circle cx="285" cy="100" r="7" fill="#4f83a0"/><text x="100" y="365" font-size="16" fill="#526c5a" font-weight="400">B</text><text x="490" y="362" font-size="16" fill="#526c5a" font-weight="400">x_B</text><text x="90" y="65" font-size="16" fill="#526c5a" font-weight="400">y_B</text><text x="294" y="255" font-size="16" fill="#526c5a" font-weight="400">L</text><text x="298" y="80" font-size="16" fill="#526c5a" font-weight="400">x_L</text><text x="145" y="247" font-size="16" fill="#526c5a" font-weight="400">y_L</text><text x="302" y="105" font-size="16" fill="#526c5a" font-weight="400">同一个物理点</text><rect x="540" y="94" width="320" height="75" rx="8" fill="#edf5ed" stroke="#c8dbc8"/><text x="556" y="123" font-size="17" fill="#345b3b" font-weight="600">先旋转，再平移</text><text x="556" y="147" font-size="12" fill="#526c5a" font-weight="400">p_B = R(θ) · p_L + t</text><text x="560" y="207" font-size="16" fill="#526c5a" font-weight="400">θ = 90° = π/2 rad</text><text x="560" y="242" font-size="16" fill="#526c5a" font-weight="400">t = [1, 0.5] m</text><text x="560" y="277" font-size="16" fill="#526c5a" font-weight="400">p_L = [1, 0] m</text><text x="560" y="312" font-size="16" fill="#526c5a" font-weight="400">p_B = [1, 1.5] m</text><text x="560" y="371" font-size="16" fill="#526c5a" font-weight="400">逆变换先减 t，再乘 Rᵀ</text><text x="45" y="425" font-size="14" fill="#526c5a" font-weight="400">旋转矩阵无量纲；平移和点坐标使用同一长度单位。</text></g></svg>
