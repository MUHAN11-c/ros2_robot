<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">组件参数：来源、覆盖与实际值</title><desc id="desc">Context全局CLI、管理节点当前参数和LoadNode局部覆盖分开；转发开关控制全局CLI，局部覆盖优先，三个实例输出0.20、0.36、0.30米每秒。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#769481"/></marker></defs><rect width="900" height="470" fill="#fbfdf9"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="30" y="42" font-size="23" fill="#294b32" font-weight="650">先分清来源，再核对覆盖顺序</text><rect x="30" y="85" width="260" height="88" rx="8" fill="#edf5ed" stroke="#c8dbc8"/><text x="46" y="114" font-size="17" fill="#345b3b" font-weight="600">进程Context全局CLI</text><text x="46" y="138" font-size="12" fill="#526c5a" font-weight="400">启动时 gain = 1.8</text><rect x="330" y="85" width="240" height="88" rx="8" fill="#fff2df" stroke="#c8dbc8"/><text x="346" y="114" font-size="17" fill="#345b3b" font-weight="600">管理节点自身参数</text><text x="346" y="138" font-size="12" fill="#526c5a" font-weight="400">启动1.8，之后set为1.2</text><text x="346" y="160" font-size="12" fill="#526c5a" font-weight="400">管理当前值单独查询</text><rect x="610" y="85" width="260" height="88" rx="8" fill="#edf5ed" stroke="#c8dbc8"/><text x="626" y="114" font-size="17" fill="#345b3b" font-weight="600">本次LoadNode.parameters</text><text x="626" y="138" font-size="12" fill="#526c5a" font-weight="400">局部 gain = 1.5</text><line x1="160" y1="173" x2="160" y2="235" stroke="#769481" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="213" font-size="12" fill="#526c5a" font-weight="400">forward=true时进入</text><line x1="740" y1="173" x2="740" y2="212" stroke="#769481" stroke-width="2"/><line x1="740" y1="212" x2="310" y2="212" stroke="#769481" stroke-width="2"/><line x1="310" y1="212" x2="310" y2="235" stroke="#769481" stroke-width="2" marker-end="url(#arrow)"/><text x="620" y="198" font-size="12" fill="#526c5a" font-weight="400">装载请求的局部覆盖</text><rect x="80" y="235" width="310" height="75" rx="8" fill="#edf5ed" stroke="#c8dbc8"/><text x="96" y="264" font-size="17" fill="#345b3b" font-weight="600">装载组件的NodeOptions</text><text x="96" y="288" font-size="12" fill="#526c5a" font-weight="400">manager默认不转发全局参数</text><rect x="510" y="235" width="310" height="75" rx="8" fill="#edf5ed" stroke="#c8dbc8"/><text x="526" y="264" font-size="17" fill="#345b3b" font-weight="600">显式声明并校验gain</text><text x="526" y="288" font-size="12" fill="#526c5a" font-weight="400">默认1.0；有限DOUBLE范围[0,2]</text><line x1="390" y1="273" x2="510" y2="273" stroke="#769481" stroke-width="2" marker-end="url(#arrow)"/><text x="401" y="257" font-size="12" fill="#526c5a" font-weight="400">局部覆盖优先</text><text x="30" y="335" font-size="14" fill="#345b3b" font-weight="600">同一Config类，三种装载输入的实测结果</text><rect x="30" y="347" width="260" height="75" rx="8" fill="#edf5ed" stroke="#c8dbc8"/><text x="46" y="376" font-size="17" fill="#345b3b" font-weight="600">不转发＋无局部值</text><text x="46" y="400" font-size="12" fill="#526c5a" font-weight="400">gain=1.0 → 0.20 m/s</text><rect x="320" y="347" width="260" height="75" rx="8" fill="#edf5ed" stroke="#c8dbc8"/><text x="336" y="376" font-size="17" fill="#345b3b" font-weight="600">转发＋无局部值</text><text x="336" y="400" font-size="12" fill="#526c5a" font-weight="400">gain=1.8 → 0.36 m/s</text><rect x="610" y="347" width="260" height="75" rx="8" fill="#edf5ed" stroke="#c8dbc8"/><text x="626" y="376" font-size="17" fill="#345b3b" font-weight="600">提供局部gain=1.5</text><text x="626" y="400" font-size="12" fill="#526c5a" font-weight="400">gain=1.5 → 0.30 m/s</text><text x="30" y="453" font-size="13" fill="#526c5a" font-weight="400">输出为0.2 m/s × gain；三个结果来自不同加载实例，管理参数修改不改写Context CLI。</text></g></svg>
