# Jazzy 仿真导航：地图与 AMCL 先启动，规划、控制、恢复、平滑就绪后才启用行为树。
# 下面长度以 m，线/角速度以 m/s 与 rad/s，常规超时以 s；行为树超时参数明确为 ms。
/**/map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    topic_name: map

/**/amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: scan
    set_initial_pose: false
    tf_broadcast: true
    transform_tolerance: 0.32
    laser_model_type: likelihood_field
    robot_model_type: nav2_amcl::DifferentialMotionModel
    max_beams: 60
    min_particles: 450
    max_particles: 800
    update_min_d: 0.08
    update_min_a: 0.08
    resample_interval: 1
    save_pose_rate: -1.0

/**/planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      use_astar: false
      allow_unknown: false
      tolerance: 0.0

/**/global_costmap:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    resolution: 0.05
    robot_radius: 0.24
    update_frequency: 5.0
    publish_frequency: 3.0
    transform_tolerance: 0.30
    track_unknown_space: true
    always_send_full_costmap: true
    plugins: [static_layer, inflation_layer]
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: map
      map_subscribe_transient_local: true
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.48
      cost_scaling_factor: 5.0

/**/local_costmap:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_link
    rolling_window: true
    width: 3
    height: 3
    resolution: 0.05
    robot_radius: 0.24
    update_frequency: 10.0
    publish_frequency: 5.0
    transform_tolerance: 0.30
    always_send_full_costmap: true
    plugins: [obstacle_layer, inflation_layer]
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      observation_sources: lidar
      lidar:
        data_type: LaserScan
        topic: scan
        marking: true
        clearing: true
        obstacle_min_range: 0.10
        obstacle_max_range: 4.0
        raytrace_max_range: 4.5
        max_obstacle_height: 0.8
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.48
      cost_scaling_factor: 5.0

/**/controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    odom_topic: odom
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.16
      # 允许低速原地转向后再产生平移，独立于目标完成的距离与偏航检查。
      movement_time_allowance: 12.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.17
      yaw_goal_tolerance: 0.18
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.45
      lookahead_dist: 0.46
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.65
      lookahead_time: 1.25
      use_velocity_scaled_lookahead_dist: true
      use_rotate_to_heading: true
      # 首跑 0.85 rad/s 时，终态后平滑器的减速仍会积累偏航。保留独立停稳误差判据。
      rotate_to_heading_angular_vel: 0.45
      rotate_to_heading_min_angle: 0.55
      max_angular_accel: 2.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.60
      regulated_linear_scaling_min_speed: 0.16
      cost_scaling_dist: 0.40
      inflation_cost_scaling_factor: 5.0
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.55
      transform_tolerance: 0.25

/**/behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    global_frame: map
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.30
    cycle_frequency: 10.0
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait

/**/velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    smoothing_frequency: 30.0
    feedback: CLOSED_LOOP
    odom_topic: odom
    odom_duration: 0.10
    scale_velocities: false
    # 差速底盘 y 速度固定为零。超时以节点 ROS 时钟计，验收等待以单调墙钟计。
    max_velocity: [0.50, 0.0, 1.2]
    min_velocity: [-0.20, 0.0, -1.2]
    max_accel: [0.70, 0.0, 2.0]
    max_decel: [-0.90, 0.0, -2.2]
    deadband_velocity: [0.008, 0.0, 0.012]
    velocity_timeout: 0.4

/**/bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    transform_tolerance: 0.30
    bt_loop_duration: 10
    default_server_timeout: 90
    wait_for_service_timeout: 4000
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
