# 【中文教学注释】 examples/src/atlas_py/setup.cfg
# 输入输出：输入为setuptools安装配置；输出是开发/普通安装时的脚本目标目录，供ROS按包名发现入口。
# 执行顺序与边界：script_dir/install_scripts均与console_scripts配套；$base是安装基路径，目录配置没有物理单位，不负责创建ROS节点。
# 此段名对应setuptools开发安装或普通安装设置；保持与包内入口安装约定一致。
[develop]
# 把console_scripts入口安装到lib/包名供ros2 run发现；$base由setuptools展开，不是要手工填入的用户HOME。
script_dir=$base/lib/atlas_py
[install]
install_scripts=$base/lib/atlas_py
