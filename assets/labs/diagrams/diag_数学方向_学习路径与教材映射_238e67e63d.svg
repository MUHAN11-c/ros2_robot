-svg-flowchart-S0-0" data-look="neo" transform="translate(88, 783)"><rect class="basic label-container" style="fill:#F4C8D9 !important;stroke:#D98FAF !important" x="-76" y="-117" width="152" height="234"/><g class="label" style="" transform="translate(-60, -105)"><rect/><foreignObject width="120" height="210"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>⛩ 第〇阶 · 零基础筑基（从这里开始）<br />微积分 I/II · 线代 I/II · 概率统计 · 数值方法<br />教材：同济《高数》《线代》· 浙大《概率》· 李庆扬《数值分析》</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S1-1" data-look="neo" transform="translate(88, 530)"><rect class="basic label-container" style="fill:#FFFFFF !important;stroke:#8166B1 !important" x="-76" y="-96" width="152" height="192"/><g class="label" style="" transform="translate(-60, -84)"><rect/><foreignObject width="120" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>⚡ 第一阶 · 本科核心<br />常微分方程 · 多元微积分深入 · 线代加深<br />教材：同济《高数》下册 · 王高雄《常微分方程》</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S2-2" data-look="neo" transform="translate(88, 308.5)"><rect class="basic label-container" style="fill:#F7F4FA !important;stroke:#8166B1 !important" x="-76" y="-85.5" width="152" height="171"/><g class="label" style="" transform="translate(-60, -73.5)"><rect/><foreignObject width="120" height="147"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>❖ 第二阶 · 研究生进阶<br />凸优化 · 状态估计 · 微分几何<br />教材：Boyd《凸优化》· Barfoot · do Carmo</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S3-3" data-look="neo" transform="translate(88, 97.5)"><rect class="basic label-container" style="fill:#FBF6EC !important;stroke:#C9A96E !important" x="-76" y="-85.5" width="152" height="171"/><g class="label" style="" transform="translate(-60, -73.5)"><rect/><foreignObject width="120" height="147"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>✦ 第三阶 · 前沿/博士<br />10_纯数学基础 ~ 95_随机分析 共 10 个子方向<br />教材：专题专著 + 论文</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#8166B1" stop-opacity="1"/><stop offset="100%" stop-color="hsl(-120, 0%, 90%)" stop-opacity="1"/></linearGradient></svg>