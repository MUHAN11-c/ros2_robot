<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" role="img" aria-label="Sakura Robotics Lab 吉祥物：紫樱（Sakura）">
  <!-- 紫樱 v4 · Bongo Cat 风极简二次元小人：扁平色块 + 粗描边 + 大头小身。
       品牌元素仅三处：雷紫波波头、雷菱发饰、樱花瓣点缀。 -->
  <defs>
    <linearGradient id="sy-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B9A0E4"/>
      <stop offset="100%" stop-color="#9A7DD0"/>
    </linearGradient>
  </defs>

  <!-- 地面阴影 -->
  <ellipse cx="140" cy="284" rx="62" ry="8" fill="#292530" opacity="0.10"/>

  <!-- 后层头发（波波头外轮廓） -->
  <path d="M78 122 Q74 50 140 44 Q206 50 202 122 L204 162 Q204 182 184 184
           Q170 185 168 170 L166 148 L114 148 L112 170 Q110 185 96 184
           Q76 182 76 162 Z"
        fill="url(#sy-hair)" stroke="#7B5FAE" stroke-width="3" stroke-linejoin="round"/>

  <!-- 身体：白色小裙 -->
  <path d="M102 170 L178 170 Q192 174 190 192 L186 250 Q140 262 94 250 L90 192
           Q88 174 102 170 Z"
        fill="#FFFFFF" stroke="#3A3540" stroke-width="3" stroke-linejoin="round"/>
  <!-- 领口水手领 -->
  <path d="M118 170 L140 186 L162 170 L166 178 L140 194 L114 178 Z"
        fill="#8166B1" stroke="#3A3540" stroke-width="3" stroke-linejoin="round"/>
  <!-- 下摆饰带 -->
  <path d="M97 242 Q140 250 183 242" fill="none" stroke="#8166B1" stroke-width="5" stroke-linecap="round"/>
  <!-- 裙上樱花点缀 -->
  <g fill="#EFAFC5">
    <ellipse cx="120" cy="216" rx="3.4" ry="5" transform="rotate(18 120 216)"/>
    <ellipse cx="120" cy="216" rx="3.4" ry="5" transform="rotate(108 120 216)"/>
    <ellipse cx="120" cy="216" rx="3.4" ry="5" transform="rotate(198 120 216)"/>
    <ellipse cx="161" cy="224" rx="3" ry="4.4" transform="rotate(18 161 224)"/>
    <ellipse cx="161" cy="224" rx="3" ry="4.4" transform="rotate(108 161 224)"/>
    <ellipse cx="161" cy="224" rx="3" ry="4.4" transform="rotate(198 161 224)"/>
  </g>

  <!-- 左臂（下垂小短手） -->
  <path d="M96 186 Q82 196 78 216" fill="none" stroke="#3A3540" stroke-width="20" stroke-linecap="round"/>
  <path d="M96 186 Q82 196 78 216" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <circle cx="78" cy="220" r="11" fill="#FFF9FC" stroke="#3A3540" stroke-width="3"/>

  <!-- 双腿小短腿 -->
  <rect x="116" y="252" width="17" height="20" rx="8" fill="#FFF9FC" stroke="#3A3540" stroke-width="3"/>
  <rect x="147" y="252" width="17" height="20" rx="8" fill="#FFF9FC" stroke="#3A3540" stroke-width="3"/>

  <!-- 右臂（举起挥手 · Bongo Cat 姿势） -->
  <path d="M184 184 Q200 174 208 156" fill="none" stroke="#3A3540" stroke-width="20" stroke-linecap="round"/>
  <path d="M184 184 Q200 174 208 156" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <!-- 挥手小肉爪 -->
  <circle cx="212" cy="150" r="13" fill="#FFF9FC" stroke="#3A3540" stroke-width="3"/>
  <path d="M204 140 Q203 134 206 131 M212 137 Q212 131 212 128 M220 140 Q221 134 218 131"
        fill="none" stroke="#3A3540" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 脸 -->
  <ellipse cx="140" cy="118" rx="58" ry="54" fill="#FFF9FC" stroke="#3A3540" stroke-width="3"/>

  <!-- 前发刘海（平刘海 + 圆弧缺口） -->
  <path d="M82 116 Q78 56 140 50 Q202 56 198 116 Q196 100 184 98 Q186 84 170 84
           Q164 72 148 78 Q140 68 128 78 Q112 72 106 84 Q92 86 96 100 Q84 102 82 116 Z"
        fill="url(#sy-hair)" stroke="#7B5FAE" stroke-width="3" stroke-linejoin="round"/>
  <!-- 樱粉挑染 -->
  <path d="M150 56 Q156 68 151 80 Q146 70 148 58 Z" fill="#EFAFC5"/>
  <!-- 呆毛 -->
  <path d="M138 52 Q132 36 148 32 Q138 42 143 50" fill="none" stroke="#9A7DD0" stroke-width="5" stroke-linecap="round"/>

  <!-- 雷菱发饰 -->
  <g transform="rotate(-12 103 86)">
    <path d="M103 76 L111 86 L103 96 L95 86 Z" fill="#9370DB" stroke="#E8DDF6" stroke-width="2" stroke-linejoin="round"/>
    <path d="M103 81 L107 86 L103 91 L99 86 Z" fill="#E8DDF6"/>
  </g>

  <!-- 五官：Bongo Cat 式极简 -->
  <ellipse cx="116" cy="124" rx="7" ry="10" fill="#3A3540"/>
  <ellipse cx="164" cy="124" rx="7" ry="10" fill="#3A3540"/>
  <circle cx="114" cy="119" r="2.6" fill="#FFFFFF"/>
  <circle cx="162" cy="119" r="2.6" fill="#FFFFFF"/>
  <path d="M132 146 Q140 154 148 146" fill="none" stroke="#3A3540" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="98" cy="140" rx="9" ry="6" fill="#F4B8CC" opacity="0.85"/>
  <ellipse cx="182" cy="140" rx="9" ry="6" fill="#F4B8CC" opacity="0.85"/>

  <!-- 樱花瓣点缀 -->
  <g transform="rotate(24 236 118)">
    <path d="M236 110 Q242 114 236 122 Q230 114 236 110 Z" fill="#F4C8D9" stroke="#E5A8C2" stroke-width="1.5"/>
  </g>
  <g transform="rotate(-28 62 108)">
    <path d="M62 102 Q67 105 62 112 Q57 105 62 102 Z" fill="#F4C8D9" stroke="#E5A8C2" stroke-width="1.2"/>
  </g>
</svg>
